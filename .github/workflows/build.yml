name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Protocol module tests
        run: ./gradlew :airplay:test :dlna:test

      # Builds every flavor (home and production).
      - name: Assemble debug APKs
        run: ./gradlew :app:assembleDebug

      # Flavors put APKs under apk/<flavor>/debug/. Failing when nothing matches
      # keeps a future output-path change from silently uploading no artifacts.
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: vibeview-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests"

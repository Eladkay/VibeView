[versions]
agp = "8.7.3"
kotlin = "2.1.0"
coroutines = "1.9.0"
coreKtx = "1.15.0"
appcompat = "1.7.0"
constraintlayout = "2.2.0"
lifecycle = "2.8.7"
preference = "1.2.1"
media3 = "1.5.1"
netty = "4.1.115.Final"
jmdns = "3.6.3"
ddPlist = "1.28"
eddsa = "0.3.0"
curve25519 = "0.5.0"
slf4j = "1.7.36"
junit5 = "5.10.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-preference = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "netty" }
jmdns = { module = "org.jmdns:jmdns", version.ref = "jmdns" }
dd-plist = { module = "com.googlecode.plist:dd-plist", version.ref = "ddPlist" }
eddsa = { module = "net.i2p.crypto:eddsa", version.ref = "eddsa" }
curve25519 = { module = "org.whispersystems:curve25519-java", version.ref = "curve25519" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-android = { module = "org.slf4j:slf4j-android", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
